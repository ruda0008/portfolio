<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Aryan Rudani — Cloud Developer & Security</title>
    <meta
      name="description"
      content="Aryan Rudani — Cloud developer and cybersecurity analyst building secure, automated infrastructure on AWS and Azure. DevSecOps, serverless, and Kubernetes."
    />
    <meta name="theme-color" content="#05070f" />

    <!-- Open Graph -->
    <meta property="og:title" content="Aryan Rudani — Cloud Developer & Security Architect" />
    <meta
      property="og:description"
      content="High-performance cloud infrastructure, automated DevSecOps, and Terraform Landing Zones on AWS and Azure."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aryanrudani.space" />

    <!-- No-flash theme init: defaults to dark cyber mode unless explicitly set to light -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme_v3');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Fonts: Space Grotesk (cyber display), JetBrains Mono (telemetry/code), Syne (modern headings), Inter (UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
